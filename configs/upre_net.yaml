# UP³RE-Net research configuration
# Uncertainty-Propagated Per-Pixel Reweighting Ensemble Network

model:
  name: mobilenetv2unet
  in_channels: 1
  out_channels: 1
  ensemble_size: 3

training:
  batch_size: 8
  image_size: [256, 256]
  num_workers: 4
  pin_memory: true
  learning_rate: 0.001

  # Stage 1: Bagging ensemble
  stage1:
    epochs: 25
    patience: 10
    pos_weight: 10.0
    dice_weight: 0.5
    bce_weight: 0.5
    mixed_precision: true

  # Stage 1.5: Uncertainty pre-computation
  uncertainty:
    num_bootstraps: 3
    output_dir: tmp/uncertainty

  # Stage 2: UWACL boosting
  stage2:
    epochs: 25
    patience: 10
    beta: 5.0
    tau: 0.1
    tau_schedule: linear_decay
    tau_min: 0.01

preprocessing:
  hu_window: [-100, 400]
  clahe:
    clip: 2.0
    grid: [8, 8]
  target_size: [256, 256]

augmentation:
  flip_prob: 0.5
  shift_range: 0.1

data:
  splits_dir: data/splits
  metadata_dir: data/metadata

tracking:
  enabled: false
  mlflow_uri: ""
  experiment_name: upre-net-research

outputs:
  model_dir: models/upre
  log_dir: outputs/logs
  report_dir: outputs/research
