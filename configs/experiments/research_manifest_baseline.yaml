inherits:
  - ../defaults/preprocessing
  - ../datasets/lits_verified
  - ../models/mobilenetv2_unet

experiment:
  name: research-manifest-baseline-focal-dice
  seed: 42

data:
  split_dir: 'D:\DATA SCIENCE AND ANALYTICS\Dataset\Liver\02_staging\build_corrected_20260713_214847_v2\splits'

preprocessing:
  input_format: png_8bit_windowed
  apply_hu_window: false
  target_size: [256, 256]
  clahe:
    enabled: false

augmentation:
  horizontal_flip_prob: 0.5
  intensity_shift_range: 0.1

training:
  epochs: 10
  batch_size: 4
  num_workers: 0
  pin_memory: true
  mixed_precision: true
  tumor_sampler_weight: 3.0
  learning_rate: 0.001
  weight_decay: 0.0001

loss:
  name: focal_dice
  focal_alpha: 0.75
  focal_gamma: 2.0
  focal_weight: 0.5
  dice_weight: 0.5

evaluation:
  thresholds: [0.10, 0.15, 0.20, 0.25, 0.30, 0.35, 0.40, 0.45, 0.50, 0.55, 0.60, 0.65, 0.70, 0.75, 0.80, 0.85, 0.90]

outputs:
  run_dir: experiments/research_validation/manifest_baseline_focal_dice
  model_dir: models/research_validation/manifest_baseline_focal_dice
