# Baseline configuration for Liver Tumor Segmentation
# Use: python scripts/train.py --config configs/baseline.yaml

model:
  name: mobilenetv2unet
  in_channels: 1
  out_channels: 1

training:
  batch_size: 8
  image_size: [256, 256]
  num_workers: 4
  pin_memory: true
  learning_rate: 0.001
  num_epochs: 50
  mixed_precision: true

preprocessing:
  hu_window: [-100, 400]
  clahe:
    clip: 2.0
    grid: [8, 8]
  target_size: [256, 256]

augmentation:
  flip_prob: 0.5
  shift_range: 0.1

data:
  splits_dir: data/splits
  metadata_dir: data/metadata

tracking:
  enabled: false  # Set to true and configure MLflow URI to enable
  mlflow_uri: ""
  experiment_name: liver-segmentation

outputs:
  model_dir: models
  log_dir: outputs/logs
  report_dir: outputs/reports
